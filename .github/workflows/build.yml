name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile everything
        run: make
      - name: Check the results shown in the videos
        run: |
          set -e
          strip() { sed 's/\x1b\[[0-9;]*m//g'; }
          (cd 01-the-196-mystery && ./palindromo 59 | strip | grep -q "palíndromo en 3 pasos")
          (cd 01-the-196-mystery && ./palindromo_grande 196 50000 | strip | grep -q "20779 dígitos")
          (cd 02-the-celebrity-problem && ./prueba | strip | grep -q "5000/5000")
          (cd 03-the-game-of-fifteen && ./trios | strip | grep -q "8 tríos")
          (cd 03-the-game-of-fifteen && ./prueba | strip | grep -Eq "ganas tú: +0$")
          (cd 04-pi-with-darts && ./dardos 1000000 | strip | grep -q "3.141008")
          (cd 05-self-correcting-numbers && ./digito | strip | grep -q "Digito de 45108273: 1")
          (cd 05-self-correcting-numbers && ./luhn | strip | grep -q "4111111111901115  ->  ✓ pasa")
          (cd 05-self-correcting-numbers && ./hamming | strip | grep -q "error en el bit 5")
          (cd 05-self-correcting-numbers && ./simulacion | strip | grep -q "letras):  0.00 %")
          (cd 06-reed-solomon && ./rs | strip | grep -q "5 errores corregidos")
          (cd 06-reed-solomon && ./rs | strip | grep -q "no se puede: demasiados errores")
          (cd 06-reed-solomon && ./rs --prueba | strip | grep -q "detectado 2000/2000 · corregido mal sin avisar 0/2000")
          (cd 06-reed-solomon && ./intercalado 112 | strip | grep -q "el peor pierde 4 de 28 bytes")
          (cd 07-collatz-conjecture && ./collatz 6 | strip | grep -q "8 pasos · máximo 16")
          (cd 07-collatz-conjecture && ./collatz 27 | strip | grep -q "111 pasos · máximo 9232 (paso 77)")
          (cd 07-collatz-conjecture && ./verifica 10000000 | strip | grep -q "el más largo: 8 400 511")
          (cd 08-goldbach-conjecture && ./goldbach 28 | strip | grep -qx "2 formas")
          (cd 08-goldbach-conjecture && ./goldbach 100 --cuenta | strip | grep -qx "6 formas")
          (cd 08-goldbach-conjecture && ./goldbach 1000 --cuenta | strip | grep -qx "28 formas")
          (cd 08-goldbach-conjecture && ./verifica 100000000 | strip | grep -q "pares del 4 al 100 000 000: 49 999 999")
          (cd 08-goldbach-conjecture && ./verifica 100000000 | strip | grep -q "todos son suma de dos primos ✓")
          (cd 09-caesar-cipher && ./cesar | strip | grep -q "clave  3 → ATACAR AL AMANECER   ← español")
          (cd 09-caesar-cipher && ./cesar "DWDFDU DO DPDQHFHU" --distancias | strip | grep -q "clave  3 → ATACAR AL AMANECER  distancia 18")
          (cd 09-caesar-cipher && ./cesar "DWDFDU DO DPDQHFHU" --distancias | strip | grep -q "clave 16 → NGNPNE NY NZNARPRE  distancia 59")
          (cd 09-caesar-cipher && ./cesar "DT WPPD PDEZ JL AFPOPD CZXAPC L NPDLC" | strip | grep -q "clave 11 → SI LEES ESTO YA PUEDES ROMPER A CESAR   ← español")
          (cd 10-kaprekar-constant && ./kaprekar 1998 | strip | grep -q "6174 en 3 pasos")
          (cd 10-kaprekar-constant && ./kaprekar 2111 --sin-ceros | strip | grep -q "atascado en 0")
          (cd 10-kaprekar-constant && ./kaprekar 2111 | strip | grep -q "6174 en 5 pasos")
          (cd 10-kaprekar-constant && ./verifica | strip | grep -q "llegan a 6174: 8991 de 8991")
          (cd 10-kaprekar-constant && ./verifica | strip | grep -q "el que más tarda: 7 pasos")
          (cd 10-kaprekar-constant && ./verifica 1900 2026 | strip | grep -Eq "7 pasos: +18$")
          (cd 10-kaprekar-constant && ./otras 3 | strip | grep -q "495  (fijo)")
          (cd 11-monty-hall && ./monty 1000000 | strip | grep -q "cambiar:  666266 victorias (66.6 %)")
          (cd 11-monty-hall && ./monty 1000000 100 | strip | grep -q "cambiar:  990053 victorias (99.0 %)")
          (cd 11-monty-hall && ./monty 1000000 3 --azar | strip | grep -q "cambiar:  333616 victorias (50.1 %)")
          echo "All results match the videos ✔"
